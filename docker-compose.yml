services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/springBootCrud
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: springBootCrud
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: springBootCrud
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
